name: Deploy Otomatis

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy ke VPS
        env:
          ADMIN_NEW_PASS: ${{ secrets.ADMIN_NEW_PASS }}
          ADMIN_DEFAULT_PASSWORD: ${{ secrets.ADMIN_DEFAULT_PASSWORD }}
        run: |
          cd /var/www/lt3

          echo "=== Git Pull ==="
          rm -rf Frontend/dist
          git clean -fd
          git reset --hard HEAD
          git fetch origin main
          git reset --hard origin/main

          echo "=== Backend ==="
          cd /var/www/lt3/Backend

          echo "=== Update Admin Password ==="
          PASS_INPUT="${ADMIN_NEW_PASS:-$ADMIN_DEFAULT_PASSWORD}"
          if [ -n "$PASS_INPUT" ]; then
            php artisan admin:set-password "$PASS_INPUT"

            if grep -q "^ADMIN_DEFAULT_PASSWORD=" .env; then
              sed -i "s|^ADMIN_DEFAULT_PASSWORD=.*|ADMIN_DEFAULT_PASSWORD=$PASS_INPUT|" .env
            else
              echo "ADMIN_DEFAULT_PASSWORD=$PASS_INPUT" >> .env
            fi
          fi

          composer install --no-interaction --prefer-dist --optimize-autoloader

          echo "=== Run Migrations ==="
          php artisan migrate --force

          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          echo "=== Frontend ==="
          cd /var/www/lt3/Frontend

          npm install
          npm run build

          echo "=== Permission ==="
          sudo chown -R www-data:deploy /var/www/lt3
          sudo chmod -R g+rwX /var/www/lt3

          echo "=== Restart Services ==="
          sudo systemctl restart php8.4-fpm
          sudo systemctl reload nginx

          echo "=== Deploy Selesai ==="