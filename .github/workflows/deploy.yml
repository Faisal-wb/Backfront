name: Deploy Otomatis

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy ke VPS
        env:
          ADMIN_NEW_PASS: ${{ secrets.ADMIN_NEW_PASS }}
          ADMIN_DEFAULT_PASSWORD: ${{ secrets.ADMIN_DEFAULT_PASSWORD }}
        run: |
          cd /var/www/lt3

          echo "=== Git Pull ==="
          git pull origin main

          echo "=== Backend ==="
          cd /var/www/lt3/Backend

          # Update password admin langsung via Tinker menggunakan secret dari GitHub
          export NEW_PASS="${ADMIN_NEW_PASS:-$ADMIN_DEFAULT_PASSWORD}"
          if [ -n "$NEW_PASS" ]; then
            echo "Mengupdate password admin di MySQL VPS..."
            php artisan tinker --execute="\$p = getenv('NEW_PASS'); if(!empty(\$p)) { \$u = App\Models\User::where('name', 'admin')->orWhere('email', 'admin@tjkt.sch.id')->first(); if(\$u) { \$u->password = Hash::make(\$p); \$u->save(); echo 'Password admin berhasil diupdate di database!'; } }"

            if grep -q "^ADMIN_DEFAULT_PASSWORD=" .env; then
              sed -i "s|^ADMIN_DEFAULT_PASSWORD=.*|ADMIN_DEFAULT_PASSWORD=$NEW_PASS|" .env
            else
              echo "ADMIN_DEFAULT_PASSWORD=$NEW_PASS" >> .env
            fi
          fi

          composer install --no-interaction --prefer-dist --optimize-autoloader

          echo "=== Run Migrations ==="
          php artisan migrate --force

          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          echo "=== Frontend ==="
          cd /var/www/lt3/Frontend

          npm install
          npm run build

          echo "=== Permission ==="
          sudo chown -R www-data:deploy /var/www/lt3
          sudo chmod -R g+rwX /var/www/lt3

          echo "=== Restart Services ==="
          sudo systemctl restart php8.4-fpm
          sudo systemctl reload nginx

          echo "=== Deploy Selesai ==="